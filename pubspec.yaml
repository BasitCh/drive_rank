name: drive_rank
description: "DriveRank — Track your trips. Flex your stats."
publish_to: "none"
version: 1.1.0+11

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State + navigation + DI
  flutter_bloc: ^9.0.0
  go_router: ^14.0.0
  get_it: ^8.0.0
  injectable: ^2.4.0

  # Models + functional error handling
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  fpdart: ^1.1.0

  # Local DB (Drift / SQLite)
  drift: ^2.23.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_analytics: ^11.0.0
  firebase_crashlytics: ^4.0.0

  # Payments
  purchases_flutter: ^9.0.0

  # GPS + sensors + map
  geolocator: ^13.0.0
  sensors_plus: ^5.0.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  fl_chart: ^0.69.0

  # Sharing + capture + media
  share_plus: ^10.0.0
  screenshot: ^3.0.0
  image_picker: ^1.1.0

  # Network
  dio: ^5.7.0
  retrofit: ^4.4.0
  connectivity_plus: ^6.0.0

  # Push + analytics
  onesignal_flutter: ^5.2.0
  posthog_flutter: ^4.2.0

  # Locale, env, assets
  intl: ^0.20.2
  flutter_dotenv: ^5.2.1
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.10+1
  flutter_animate: ^4.5.0
  uuid: ^4.4.0
  audioplayers: ^6.1.0
  in_app_update: ^4.2.3
  url_launcher: ^6.3.0
  flutter_local_notifications: ^17.2.0
  device_info_plus: ^11.1.0
  crypto: ^3.0.5

  # System
  permission_handler: ^11.3.0
  flutter_background_service: ^5.0.5

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.0
  injectable_generator: ^2.4.0
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  drift_dev: ^2.23.0
  retrofit_generator: ^10.2.6

  very_good_analysis: ^6.0.0
  mocktail: ^1.0.3
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/images/cars/
    - assets/data/
    - assets/sound/

  fonts:
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-VariableFont_wght.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-VariableFont_wght.ttf
