<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" fill="none">
  <!-- Body — taller, more upright than the sedan -->
  <path d="M16 72 L28 72 L34 44 L66 32 L148 32 L168 44 L188 50 L186 72 L174 72" stroke="#3ECFBF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Greenhouse (tall, flatter roof) -->
  <path d="M44 44 L70 36 L142 36 L162 44 Z" stroke="#3ECFBF" stroke-width="2" stroke-linejoin="round" opacity="0.55"/>
  <!-- Pillars / windows divider -->
  <line x1="80" y1="36" x2="80" y2="44" stroke="#3ECFBF" stroke-width="1.5" opacity="0.55"/>
  <line x1="116" y1="36" x2="116" y2="44" stroke="#3ECFBF" stroke-width="1.5" opacity="0.55"/>
  <!-- Cladding / roof rails -->
  <line x1="40" y1="32" x2="148" y2="32" stroke="#3ECFBF" stroke-width="1" opacity="0.35"/>
  <!-- Wheel arches + wheels (chunky) -->
  <path d="M30 72 Q30 60 44 60 Q58 60 58 72" stroke="#3ECFBF" stroke-width="2" stroke-linecap="round"/>
  <path d="M150 72 Q150 60 164 60 Q178 60 178 72" stroke="#3ECFBF" stroke-width="2" stroke-linecap="round"/>
  <circle cx="44" cy="76" r="9" stroke="#3ECFBF" stroke-width="2.5"/>
  <circle cx="164" cy="76" r="9" stroke="#3ECFBF" stroke-width="2.5"/>
  <circle cx="44" cy="76" r="3.5" stroke="#3ECFBF" stroke-width="1.5" opacity="0.4"/>
  <circle cx="164" cy="76" r="3.5" stroke="#3ECFBF" stroke-width="1.5" opacity="0.4"/>
  <!-- Lights -->
  <line x1="178" y1="56" x2="184" y2="56" stroke="#3ECFBF" stroke-width="2" stroke-linecap="round"/>
</svg>
